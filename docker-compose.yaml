services:
  db:
    image: pgvector/pgvector:pg16
    container_name: bible_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bible_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d bible_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: bible_web
    restart: always
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/bible_db
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    container_name: bible_bot
    restart: always
    command: python -m app.bot.main_bot
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/bible_db
      - API_URL=http://web:8000/api/v1/search
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  